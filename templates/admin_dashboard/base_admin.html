<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel | WhiteLabel Commerce{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-light">
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-secondary border-opacity-25 shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="{% url 'admin_dashboard:overview' %}">
                <i class="fa-solid fa-shield-halved text-primary"></i>
                <span>AURA <span class="badge bg-primary text-white rounded-pill px-2 fs-6">ADMIN</span></span>
            </a>

            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="{% url 'storefront:home' %}" target="_blank" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Storefront
                </a>
                <div class="dropdown">
                    <button class="btn btn-dark btn-sm dropdown-toggle rounded-pill px-3 border border-secondary" type="button" data-bs-toggle="dropdown">
                        <i class="fa-solid fa-user-shield text-primary me-1"></i> {{ user.username }}
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2">
                        <li><span class="dropdown-item-text text-muted small">Logged in as Administrator</span></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="{% url 'admin_dashboard:logout' %}"><i class="fa-solid fa-right-from-bracket me-2"></i> Log Out</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-0">
        <div class="row g-0">
            <!-- Sidebar -->
            <div class="col-lg-2 admin-sidebar p-3 d-none d-lg-block">
                <div class="small fw-bold text-uppercase text-muted px-3 mb-2">Management</div>
                <nav class="nav flex-column">
                    <a class="nav-link {% if request.resolver_match.url_name == 'overview' %}active{% endif %}" href="{% url 'admin_dashboard:overview' %}">
                        <i class="fa-solid fa-chart-pie me-2"></i> Overview
                    </a>
                    <a class="nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'admin_dashboard:products_list' %}">
                        <i class="fa-solid fa-boxes-stacked me-2"></i> Catalog Products
                    </a>
                    <a class="nav-link {% if 'order' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'admin_dashboard:orders_list' %}">
                        <i class="fa-solid fa-receipt me-2"></i> Order Fulfillment
                    </a>
                </nav>
            </div>

            <!-- Main Content Area -->
            <div class="col-lg-10 p-4">
                <!-- Mobile Navigation Bar -->
                <div class="d-lg-none mb-3">
                    <div class="btn-group w-100 shadow-sm rounded-pill overflow-hidden" role="group">
                        <a href="{% url 'admin_dashboard:overview' %}" class="btn btn-outline-dark {% if request.resolver_match.url_name == 'overview' %}active{% endif %}">Overview</a>
                        <a href="{% url 'admin_dashboard:products_list' %}" class="btn btn-outline-dark {% if 'product' in request.resolver_match.url_name %}active{% endif %}">Products</a>
                        <a href="{% url 'admin_dashboard:orders_list' %}" class="btn btn-outline-dark {% if 'order' in request.resolver_match.url_name %}active{% endif %}">Orders</a>
                    </div>
                </div>

                <!-- Messages -->
                {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show rounded-4 shadow-sm mb-4" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endfor %}
                {% endif %}

                {% block admin_content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
