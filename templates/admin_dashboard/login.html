<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal Login | Aura Admin</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card border-0 rounded-4 shadow-lg p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="display-5 text-primary mb-2"><i class="fa-solid fa-shield-halved"></i></div>
                        <h3 class="fw-extrabold mb-1">Aura Staff Login</h3>
                        <p class="text-muted small">Restricted portal for shop management</p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                        <div class="alert alert-danger rounded-3 small py-2" role="alert">
                            {{ message }}
                        </div>
                        {% endfor %}
                    {% endif %}

                    <form action="{% url 'admin_dashboard:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label small fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-regular fa-user text-muted"></i></span>
                                <input type="text" name="username" id="id_username" class="form-control bg-light border-start-0" placeholder="admin" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="id_password" class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" name="password" id="id_password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 rounded-pill py-2 shadow">
                            Log In to Dashboard <i class="fa-solid fa-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center">
                        <a href="{% url 'storefront:home' %}" class="text-decoration-none small text-muted">
                            <i class="fa-solid fa-arrow-left me-1"></i> Return to Customer Storefront
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
